name: 更新每日财经热榜
on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点 = 北京时间 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取并生成每日热榜
        run: python hotnews/build_hotnews.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-hot.html
          git diff --cached --quiet || (git commit -m "chore: 更新每日财经热榜 [skip ci]" && git push)
