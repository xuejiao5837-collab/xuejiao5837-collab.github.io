<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="description" content="经典门萨风格智力测验：25道逻辑、数学、推理题，测出你的参考智商。">
<title>智力测验 · 测测你的智商</title>
<style>
:root{
  --brand:#5b4bff; --brand2:#8a5bff; --gold:#ffb020;
  --bg:#0f1020; --bg2:#171831; --card:#1e2040; --card2:#252751;
  --ink:#f5f6ff; --sub:#a9add6; --line:#33365e;
  --ok:#25d07a; --err:#ff5d6c; --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#26235c 0%,var(--bg) 55%);
  color:var(--ink);min-height:100vh;line-height:1.6;overflow-x:hidden}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 80px}

/* 顶部品牌 */
.brandbar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:26px;opacity:.9}
.brandbar .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.brandbar span{font-size:13px;letter-spacing:3px;color:var(--sub);font-weight:600}

/* 通用卡片 */
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:var(--radius);padding:24px 20px;margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* 欢迎页 */
.hero{text-align:center;padding:34px 20px 24px}
.hero .icon{font-size:60px;line-height:1;margin-bottom:14px;filter:drop-shadow(0 6px 16px rgba(139,91,255,.5))}
.hero h1{font-size:30px;font-weight:900;letter-spacing:1px;margin-bottom:10px;
  background:linear-gradient(90deg,#fff,#c9c2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero .tag{display:inline-block;background:rgba(255,176,32,.14);color:var(--gold);
  border:1px solid rgba(255,176,32,.35);border-radius:30px;padding:5px 15px;font-size:13px;font-weight:700;margin-bottom:18px}
.hero p{color:var(--sub);font-size:15px;margin-bottom:8px}
.facts{display:flex;gap:10px;justify-content:center;margin:22px 0 26px;flex-wrap:wrap}
.fact{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;
  padding:12px 16px;min-width:88px}
.fact b{display:block;font-size:22px;color:var(--gold)}
.fact span{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:800;
  cursor:pointer;transition:.18s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-main{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  box-shadow:0 8px 24px rgba(91,75,255,.4)}
.btn-gold{background:linear-gradient(135deg,#ffb020,#ff8a00);color:#2a1a00;
  box-shadow:0 8px 24px rgba(255,176,32,.3)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
.disclaimer{font-size:12px;color:#72769c;text-align:center;margin-top:18px;line-height:1.7}

/* 答题页 */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:var(--sub)}
.qhead .num{color:var(--gold);font-weight:800;font-size:15px}
.progress{height:7px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;margin-bottom:24px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));
  border-radius:10px;transition:width .35s ease;width:0}
.qcat{display:inline-block;font-size:12px;color:var(--brand);background:rgba(139,91,255,.14);
  border-radius:8px;padding:3px 10px;margin-bottom:12px;font-weight:700}
.qtext{font-size:20px;font-weight:800;line-height:1.55;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);
  border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;
  font-size:16px;transition:.16s;user-select:none}
.opt:active{transform:scale(.99)}
.opt .key{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--sub);font-size:14px}
.opt.sel{border-color:var(--brand);background:rgba(91,75,255,.14)}
.opt.sel .key{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:rgba(37,208,122,.14)}
.opt.right .key{background:var(--ok);color:#062c19;border-color:var(--ok)}
.opt.wrong{border-color:var(--err);background:rgba(255,93,108,.14)}
.opt.wrong .key{background:var(--err);color:#3a0008;border-color:var(--err)}
.qfoot{margin-top:22px;display:flex;gap:12px}
.qfoot .btn{flex:1;padding:14px;font-size:16px}
.explain{margin-top:16px;background:rgba(255,176,32,.08);border-left:3px solid var(--gold);
  border-radius:8px;padding:12px 14px;font-size:14px;color:#e8dcae;line-height:1.7}

/* 结果页 */
.score-hero{text-align:center;padding:26px 16px 20px;
  background:radial-gradient(circle at 50% 0%,rgba(139,91,255,.25),transparent 70%)}
.ring{width:170px;height:170px;margin:0 auto 16px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:52px;font-weight:900;line-height:1;
  background:linear-gradient(90deg,var(--gold),#ff7a45);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ring .val span{font-size:12px;color:var(--sub);margin-top:6px;letter-spacing:2px}
.level{font-size:26px;font-weight:900;margin-bottom:6px}
.level.d1{color:#ff5d6c}.level.d2{color:var(--gold)}.level.d3{color:#9d7bff}
.level.d4{color:#4fd1c5}.level.d5{color:var(--sub)}
.result-desc{color:var(--sub);font-size:15px;margin-bottom:6px;line-height:1.8}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--gold)}
.stat span{font-size:12px;color:var(--sub)}
.bars{margin-top:8px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar-row .lb{width:44px;color:var(--sub);flex:0 0 44px}
.bar-row .track{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden}
.bar-row .track i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));border-radius:8px}
.bar-row .pc{width:38px;text-align:right;color:var(--sub);flex:0 0 38px}

/* 结果提交 */
.submit-box{text-align:center}
.submit-box .lab{font-size:14px;color:var(--sub);margin-bottom:12px}
.nick{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;color:var(--ink);font-size:16px;font-family:inherit;margin-bottom:12px;outline:none}
.nick:focus{border-color:var(--brand)}
.submit-status{font-size:13px;margin-top:10px;min-height:20px}
.ok-txt{color:var(--ok)}.err-txt{color:var(--err)}

/* 打赏 */
.tip-box{text-align:center;background:linear-gradient(160deg,#2a2140,#1e2040);border-color:#4a3a6a}
.tip-box h3{font-size:19px;margin-bottom:6px}
.tip-box p{color:var(--sub);font-size:14px;margin-bottom:16px}
.qr-img{width:230px;max-width:70vw;height:auto;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip-hint{font-size:13px;color:var(--gold);margin-top:14px}
.foot{text-align:center;color:#5d6186;font-size:12px;margin-top:24px;line-height:1.8}
.confetti{position:fixed;top:-20px;width:10px;height:18px;z-index:99;pointer-events:none;opacity:.9}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar"><i class="dot"></i><span>MENSA STYLE · 智力测验</span><i class="dot"></i></div>

  <!-- 欢迎页 -->
  <section id="pg-welcome">
    <div class="card hero">
      <div class="icon">🧠</div>
      <h1>测测你的智商</h1>
      <div class="tag">经典门萨风格 · 25题</div>
      <p>涵盖数列、逻辑、类比、数学与空间推理</p>
      <p>约 5 分钟，看看你的大脑有多锋利</p>
      <div class="facts">
        <div class="fact"><b>25</b><span>道精选题</span></div>
        <div class="fact"><b>5</b><span>类题型</span></div>
        <div class="fact"><b>~5′</b><span>用时</span></div>
      </div>
      <button class="btn btn-main" onclick="startQuiz()">开始测试 →</button>
      <div class="disclaimer">本测试为趣味智力自测，参考 IQ 由正确率估算，<br>并非专业心理测量，结果仅供娱乐参考。</div>
    </div>
  </section>

  <!-- 答题页 -->
  <section id="pg-quiz" class="hidden">
    <div class="card">
      <div class="qhead"><span id="q-progress">第 1 / 25 题</span><span id="q-time">⏱ 00:00</span></div>
      <div class="progress"><i id="q-bar"></i></div>
      <span class="qcat" id="q-cat">数列</span>
      <div class="qtext" id="q-text"></div>
      <div class="opts" id="q-opts"></div>
      <div id="q-explain" class="explain hidden"></div>
      <div class="qfoot">
        <button id="q-next" class="btn btn-main hidden" onclick="nextQuestion()">下一题 →</button>
      </div>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="pg-result" class="hidden">
    <div class="card">
      <div class="score-hero">
        <div class="ring">
          <svg width="170" height="170">
            <circle cx="85" cy="85" r="72" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>
            <circle id="ring-fg" cx="85" cy="85" r="72" fill="none" stroke="url(#gr)" stroke-width="14"
              stroke-linecap="round" stroke-dasharray="452" stroke-dashoffset="452"/>
            <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffb020"/><stop offset="1" stop-color="#ff7a45"/>
            </linearGradient></defs>
          </svg>
          <div class="val"><b id="r-iq">—</b><span>参考 IQ</span></div>
        </div>
        <div id="r-level" class="level">—</div>
        <div id="r-desc" class="result-desc"></div>
      </div>
      <div class="stat-grid">
        <div class="stat"><b id="r-correct">—</b><span>答对题数</span></div>
        <div class="stat"><b id="r-acc">—</b><span>正确率</span></div>
        <div class="stat"><b id="r-time">—</b><span>用时</span></div>
      </div>
      <h3 style="font-size:16px;margin:8px 0 14px">各题型表现</h3>
      <div class="bars" id="r-bars"></div>
    </div>

    <div class="card submit-box">
      <div class="lab">留下你的成绩，加入排行榜 📊</div>
      <input id="nick" class="nick" type="text" maxlength="12" placeholder="填个昵称（选填）">
      <button class="btn btn-main" onclick="submitResult()" id="submit-btn">提交我的成绩</button>
      <div class="submit-status" id="submit-status"></div>
      <button class="btn btn-ghost" style="margin-top:12px" onclick="restart()">再测一次</button>
    </div>

    <!-- 打赏 -->
    <div class="card tip-box">
      <h3>觉得好玩？请我喝杯咖啡 ☕</h3>
      <p>你的支持是我做更多有趣内容的动力</p>

const TOPIC = "xuejiao-iq-test";   // ntfy 结果频道
const TOTAL = QUESTIONS.length;

let G = { idx:0, answers:new Array(TOTAL).fill(-1), answered:false, startTs:0, endTs:0 };

function $(id){ return document.getElementById(id); }
function show(pg){
  ["pg-welcome","pg-quiz","pg-result"].forEach(p=>$(p).classList.toggle("hidden", p!==pg));
  window.scrollTo({top:0,behavior:"smooth"});
}

// 计时器
let timer=null;
function tick(){
  const s = Math.floor((Date.now()-G.startTs)/1000);
  const m = String(Math.floor(s/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  if($("q-time")) $("q-time").textContent = "⏱ "+m+":"+ss;
}
function startQuiz(){
  G.idx=0; G.answers=new Array(TOTAL).fill(-1); G.startTs=Date.now();
  show("pg-quiz"); renderQuestion();
  clearInterval(timer); timer=setInterval(tick,1000); tick();
}

function renderQuestion(){
  const q = QUESTIONS[G.idx];
  G.answered=false;
  $("q-progress").textContent = "第 "+(G.idx+1)+" / "+TOTAL+" 题";
  $("q-bar").style.width = ((G.idx)/TOTAL*100)+"%";
  $("q-cat").textContent = q.cat;
  $("q-text").textContent = q.q;
  const box=$("q-opts"); box.innerHTML="";
  const keys=["A","B","C","D"];
  q.o.forEach((opt,i)=>{
    const d=document.createElement("div");
    d.className="opt"; d.dataset.i=i;
    d.innerHTML='<span class="key">'+keys[i]+'</span><span>'+opt+'</span>';
    d.onclick=()=>choose(i);
    box.appendChild(d);
  });
  $("q-next").classList.add("hidden");
  $("q-explain").classList.add("hidden");
}

function choose(i){
  if(G.answered) return;
  G.answered=true;
  G.answers[G.idx]=i;
  const q=QUESTIONS[G.idx];
  const opts=$("q-opts").children;
  for(let k=0;k<opts.length;k++){
    if(k===q.a) opts[k].classList.add("right");
    else if(k===i) opts[k].classList.add("wrong");
  }
  const ex=$("q-explain");
  ex.innerHTML = (i===q.a ? "✅ 回答正确！" : "❌ 正确答案："+["A","B","C","D"][q.a]) + "<br>" + q.exp;
  ex.classList.remove("hidden");
  $("q-next").classList.remove("hidden");
  $("q-next").textContent = (G.idx===TOTAL-1) ? "查看结果 🎉" : "下一题 →";
  $("q-bar").style.width = ((G.idx+1)/TOTAL*100)+"%";
}

function nextQuestion(){
  if(!G.answered) return;
  if(G.idx < TOTAL-1){ G.idx++; renderQuestion(); }
  else finish();
}

function calcResult(){
  let correct=0;
  const cats={};
  QUESTIONS.forEach((q,i)=>{
    const ok = G.answers[i]===q.a;
    if(ok) correct++;
    if(!cats[q.cat]) cats[q.cat]={c:0,t:0};
    cats[q.cat].t++; if(ok) cats[q.cat].c++;
  });
  const acc = correct/TOTAL;
  // 参考IQ：45 + 正确率×100，四舍五入
  const iq = Math.round(45 + acc*100);
  return {correct, acc, iq, cats};
}

let LAST_RESULT=null;
function finish(){
  clearInterval(timer);
  G.endTs=Date.now();
  const r=calcResult(); LAST_RESULT=r;
  const secs=Math.round((G.endTs-G.startTs)/1000);

  // 圆环动画
  $("ring-fg").style.strokeDashoffset = String(452 - 452*r.iq/160);
  $("r-iq").textContent = r.iq;
  $("r-correct").textContent = r.correct+"/"+TOTAL;
  $("r-acc").textContent = Math.round(r.acc*100)+"%";
  $("r-time").textContent = Math.floor(secs/60)+"′"+(secs%60)+"″";

  let lv, cls, desc;
  if(r.iq>=140){lv="天才级 🏆";cls="d1";desc="凤毛麟角！你的推理能力处于顶尖水平，思维敏捷且精准。"}
  else if(r.iq>=130){lv="非常优秀 🌟";cls="d2";desc="你的智力远超大多数人，逻辑与抽象思维都很出色。"}
  else if(r.iq>=120){lv="优秀 ✨";cls="d3";desc="聪明的你思路清晰，面对复杂问题也能迅速抓住关键。"}
  else if(r.iq>=110){lv="高于平均 👍";cls="d4";desc="你的表现相当不错，高于平均水平，值得肯定。"}
  else if(r.iq>=90){lv="正常水平 🙂";cls="d5";desc="你处在人群的平均区间，大多数人都是这样的。"}
  else {lv="继续加油 💪";cls="d5";desc="一次测试说明不了什么，换个状态再来一次试试？"}
  $("r-level").textContent=lv; $("r-level").className="level "+cls;
  $("r-desc").textContent=desc;

  // 分类条形图
  const bars=$("r-bars"); bars.innerHTML="";
  Object.keys(r.cats).forEach(c=>{
    const o=r.cats[c]; const pc=Math.round(o.c/o.t*100);
    const row=document.createElement("div"); row.className="bar-row";
    row.innerHTML='<span class="lb">'+c+'</span><div class="track"><i style="width:'+pc+'%"></i></div><span class="pc">'+pc+'%</span>';
    bars.appendChild(row);
  });

  show("pg-result");
  fireConfetti();
  // 自动提交成绩
  submitResult(true);
}

function fireConfetti(){
  const colors=["#ffb020","#8a5bff","#25d07a","#ff5d6c","#4fd1c5"];
  for(let i=0;i<40;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.animation="fall "+(2+Math.random()*2)+"s "+(Math.random()*.6)+"s linear forwards";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4500);
  }
}

function submitResult(auto){
  const nick=($("nick").value||"匿名").trim().slice(0,12);
  const r=LAST_RESULT; if(!r) return;
  const secs=Math.round((G.endTs-G.startTs)/1000);
  const detail = QUESTIONS.map((q,i)=> (G.answers[i]===q.a?"√":"×")).join("");
  const title="🧠 智力测验 "+(auto?"":"")+nick+" IQ "+r.iq;
  const body=[
    "【智力测验结果】",
    "昵称："+nick,
    "参考IQ："+r.iq,
    "等级："+$("r-level").textContent,
    "答对："+r.correct+"/"+TOTAL+"（"+Math.round(r.acc*100)+"%）",
    "用时："+Math.floor(secs/60)+"分"+(secs%60)+"秒",
    "答题明细："+detail,
    "时间："+new Date().toLocaleString("zh-CN")
  ].join("\n");
  const st=$("submit-status");
  st.className="submit-status"; st.textContent=auto?"正在提交成绩…":"提交中…";
  fetch("https://ntfy.sh/"+TOPIC,{
    method:"POST",
    headers:{"Title":title,"Tags":"brain","Markdown":"yes"},
    body:body
  }).then(resp=>{
    if(resp.ok){ st.className="submit-status ok-txt"; st.textContent="✅ 成绩已提交，感谢参与！"; }
    else throw new Error("HTTP "+resp.status);
  }).catch(e=>{
    st.className="submit-status err-txt";
    st.textContent="⚠️ 提交失败，可点按钮重试";
    if(!auto) $("submit-btn").classList.remove("hidden");
  });
}

function restart(){ show("pg-welcome"); }
</script>
</body>
</html>
